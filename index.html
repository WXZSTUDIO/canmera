<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <title>canmera</title>
  <script>
    // 一次性自愈：访问 ?reset 时清空 Service Worker 与全部缓存后自动重载。
    // 用于摆脱旧版 cache-first 缓存锁死（旧代码刷新不生效）的情况。
    (function () {
      if (location.search.indexOf('reset') === -1) return;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).catch(function () {});
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).catch(function () {});
      }
      try { localStorage.removeItem('canmera-reset-v1'); } catch (e) {}
      setTimeout(function () { location.replace(location.pathname); }, 800);
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 调色后画面（全屏） -->
    <canvas id="gl"></canvas>
    <!-- 摄像头源（隐藏但保持播放） -->
    <video id="video" playsinline muted autoplay></video>

    <!-- 取景器参考线 -->
    <div class="grid-overlay" id="grid" hidden>
      <i class="gv v1"></i><i class="gv v2"></i>
      <i class="gh h1"></i><i class="gh h2"></i>
    </div>

    <!-- 焦距/镜头指示条：倍率档位（0.5x 仅在设备有超广角时可用） -->
    <div class="focal" id="focal">
      <button class="fi" data-lens="ultra" type="button"><b>0.5x</b><i></i></button>
      <button class="fi active" data-lens="wide" type="button"><b>1x</b><i></i></button>
      <button class="fi" data-lens="tele" type="button"><b>2x</b><i></i></button>
      <button class="fi" data-lens="front" type="button"><b>前置</b><i></i></button>
    </div>

    <!-- 顶部：品牌 + 参数栏 -->
    <header class="top">
      <div class="brand-row">
        <div class="brand">canmera</div>
        <div class="brand-tip" id="brand-tip">未连接</div>
      </div>
      <div class="param-bar">
        <div class="meters" id="meters" hidden>
          <div class="meter"><b>L</b><span class="dots" id="dots-l"></span></div>
          <div class="meter"><b>R</b><span class="dots" id="dots-r"></span></div>
        </div>
        <button class="pill" id="btn-mode" type="button">▶ 视频</button>
        <button class="pill" id="btn-res" type="button">1080p · 60</button>
        <span class="badge-log" id="badge-log" hidden>Log</span>
        <div class="remain"><b id="remain-min">--</b><s>min</s><b id="remain-gb">--</b><s>GB</s></div>
      </div>
    </header>

    <div id="status" class="status" hidden></div>
    <div id="focus-box" class="focus-box" hidden></div>

    <!-- 影调条 -->
    <div class="looks-strip" id="looks"></div>

    <!-- 底部专业控制行 -->
    <div class="pro-bar">
      <button class="pro" data-k="flip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9a8 8 0 0 1 13-4l2 2"/><path d="M20 15a8 8 0 0 1-13 4l-2-2"/><path d="M19 3v4h-4"/><path d="M5 21v-4h4"/></svg>
        <span>前置</span>
      </button>
      <button class="pro" data-k="focus" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><text x="12" y="16" text-anchor="middle">A</text></svg>
        <span>对焦</span>
      </button>
      <button class="pro" data-k="wb" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><text x="12" y="16" text-anchor="middle">A</text><path d="M3 18l2.5-2.5L8 18l2.5-2.5L13 18"/></svg>
        <span>白平衡</span>
      </button>
      <button class="pro" data-k="iso" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="9" width="12" height="6" rx="1"/><text x="18" y="15" text-anchor="middle">A</text></svg>
        <span>感光</span>
      </button>
      <button class="pro" data-k="shutter" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="12" r="7"/><path d="M10 5l3 5-3 5-3-5z"/><text x="19" y="16" text-anchor="middle">A</text></svg>
        <span>快门速度</span>
      </button>
      <button class="pro" data-k="exp" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M9 12h6M12 9v6"/></svg>
        <span>曝光</span>
      </button>
      <button class="pro" data-k="settings" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
        <span>设置</span>
      </button>
    </div>

    <!-- 快门 -->
    <button class="shutter" id="btn-shutter" type="button"><span class="ring"></span></button>

    <!-- 最近一张（原生相机风格缩略图，点击查看详情） -->
    <button class="thumb" id="thumb" type="button" hidden aria-label="查看最近拍摄">
      <img id="thumb-img" alt="最近拍摄" />
    </button>

    <!-- 底部面板 -->
    <div class="panel" id="panel" hidden>
      <div class="panel-head">
        <b id="panel-title">面板</b>
        <button class="panel-close" id="panel-close" type="button">完成</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>

    <!-- 拍摄结果查看器：关闭方式 = 右上 ✕ / 点空白 / ESC / 下滑 -->
    <div id="viewer" class="viewer" aria-hidden="true">
      <button class="viewer-close" id="viewer-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <div class="viewer-stage" id="viewer-stage"></div>
      <p class="viewer-hint">点击空白处或下滑关闭</p>
      <div class="viewer-bar">
        <button id="pv-download" class="vbtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="M7 11l5 5 5-5" /><path d="M4 20h16" /></svg>
          下载
        </button>
        <button id="pv-share" class="vbtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M5 14v6h14v-6" /></svg>
          分享
        </button>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <input id="file-input" type="file" accept="image/*" hidden />
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
